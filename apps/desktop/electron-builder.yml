appId: com.codroon.arkompos
productName: Codroon POS
directories:
  output: release
files:
  - out/**
  # Explicit, not implicit. The main bundle require()s better-sqlite3,
  # drizzle-orm, node-thermal-printer, zod and @node-rs/argon2 at runtime
  # (electron-vite externalises dependencies), so they have to be in the
  # package. Naming only "out/**" quietly shipped a build that could not open
  # its own database — found by installing it.
  - node_modules/**
copyright: © Codroon
# native module (better-sqlite3) must stay outside the asar archive
asarUnpack:
  - "**/*.node"
# drizzle migrations ship next to the app; main resolves them via process.resourcesPath
extraResources:
  - from: ../../packages/db/drizzle
    to: drizzle
  # the window asks for this by path at runtime
  - from: build/icon.ico
    to: icon.ico
  # the PDF ticket inlines these as data: URIs (no CDN — the till is offline)
  - from: ../../packages/ui/src/fonts
    to: fonts
    filter:
      - "*.woff2"
win:
  target: nsis
  icon: build/icon.ico
nsis:
  # per-user install: no admin prompt, which matters on a shop PC where nobody
  # knows the administrator password
  oneClick: true
  perMachine: false
  allowElevation: false
  # the shop's data lives in userData, NOT here — an uninstall must not take the
  # business with it (documented in DEPLOYMENT.md)
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # taskbar / start-menu shortcut name
  shortcutName: Codroon POS
# electron-updater feed configured when updates are wired up
publish: null
